name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: replx_edge
          POSTGRES_USER: replx_edge
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U replx_edge -d replx_edge"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      REPLX_EDGE_TEST_POSTGRES_URL: postgres://replx_edge:test@localhost:5432/replx_edge?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l ./cmd ./internal ./tests ./migrations
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/... ./tests/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: replx_edge
          POSTGRES_USER: replx_edge
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U replx_edge -d replx_edge"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - run: PGPASSWORD=test psql -h localhost -U replx_edge -d replx_edge -f migrations/0001_init.sql
      - run: PGPASSWORD=test psql -h localhost -U replx_edge -d replx_edge -c "SELECT count(*) FROM schema_migrations;" || PGPASSWORD=test psql -h localhost -U replx_edge -d replx_edge -c "\\dt"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t replx-edge:ci .
      - run: docker compose -f deploy/compose.yml config

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./... || echo "govulncheck advisory-only in scaffolding"
