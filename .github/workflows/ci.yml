name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: replx_edge
          POSTGRES_USER: replx_edge
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U replx_edge -d replx_edge"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      REPLX_EDGE_TEST_POSTGRES_URL: postgres://replx_edge:test@localhost:5432/replx_edge?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l ./cmd ./internal ./tests ./migrations
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/... ./tests/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: replx_edge
          POSTGRES_USER: replx_edge
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U replx_edge -d replx_edge"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - run: for f in migrations/*.sql; do echo "== $f"; PGPASSWORD=test psql -h localhost -U replx_edge -d replx_edge -v ON_ERROR_STOP=1 -f "$f"; done
      - run: PGPASSWORD=test psql -h localhost -U replx_edge -d replx_edge -c "TABLE schema_migrations;"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t replx-edge:ci .
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t replx-edge:ci-multiarch .
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/compose.yml config
      - run: rm -f deploy/.env
        if: always()
      - name: compose smoke (config + spec + fixtures)
        run: |
          test -f tests/fixtures/plex/metadata.xml
          test -f tests/fixtures/plex/metadata.json
          test -f tests/fixtures/plex/playback_decision.json
          test -f tests/fixtures/plex/continue_watching.json
          test -f tests/fixtures/plex/hls_manifest.m3u8
          test -f tests/fixtures/plex/dash_manifest.mpd
          test -f tests/fixtures/plex/pms_events.json
          test -x scripts/backup.sh
          test -x scripts/restore.sh

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python3 scripts/build_complete_spec.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
